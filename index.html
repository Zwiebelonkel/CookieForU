<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a88b72">
  <title>A cookie for you</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at center, #b39980, #a88b72);
      color: #49372a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      padding: 32px 20px;
      text-align: center;
    }

    .cookie {
      width: fit-content;
      margin: 0 auto 38px;
      line-height: 1;
      user-select: none;
      filter: drop-shadow(0 8px 12px #49372a20);
      animation: pulse 3.8s ease-in-out infinite;
    }

    .cookie-spin {
      animation: rotate 90s linear infinite;
    }

    .cookie-face {
      display: block;
      font-size: 104px;
      transition: opacity 500ms, transform 500ms;
    }

    .cookie-face[data-bites="1"] {
      -webkit-mask-image: radial-gradient(
        circle 26px at 94% 30%, transparent 98%, black 100%
      );
      mask-image: radial-gradient(
        circle 26px at 94% 30%, transparent 98%, black 100%
      );
    }

    .cookie-face[data-bites="2"] {
      -webkit-mask-image: radial-gradient(
        circle 51px at 88% 35%, transparent 98%, black 100%
      );
      mask-image: radial-gradient(
        circle 51px at 88% 35%, transparent 98%, black 100%
      );
    }

    .cookie-face[data-bites="3"] {
      opacity: 0;
      transform: scale(0.65);
    }

    .cookie.eaten,
    .cookie.eaten .cookie-spin {
      animation-play-state: paused;
    }

    .id {
      display: block;
      width: min(100%, 38ch);
      min-height: 4em;
      margin: 0 auto;
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: clamp(9px, 2.6vw, 12px);
      line-height: 2;
      letter-spacing: 0.08em;
      overflow-wrap: anywhere;
      user-select: all;
      color: #594333;
    }

    mark {
      padding: 2px 0;
      border-radius: 3px;
      background: #65452b24;
      color: #392719;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    mark[data-level="uncommon"] {
      background: #f9d89855;
      color: #50320f;
    }

    mark[data-level="rare"] {
      background: #ffe2a477;
      color: #54310a;
      text-shadow: 0 0 10px #ffdb9655;
    }

    mark[data-level="epic"] {
      background: #fce6b899;
      color: #47270a;
      text-shadow: 0 0 14px #ffdc9a99;
    }

    mark[data-level="legendary"],
    mark[data-level="mythic"] {
      background: #fff0c5;
      color: #57330b;
      text-shadow: 0 0 18px #fff0c5;
      box-shadow: 0 0 16px #ffe7a555;
    }

    .rarity {
      min-height: 18px;
      margin-top: 13px;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.65;
    }

    .rarity[data-level="rare"],
    .rarity[data-level="epic"],
    .rarity[data-level="legendary"],
    .rarity[data-level="mythic"] {
      color: #fff0ce;
      opacity: 1;
    }

    p {
      margin: 24px 0 0;
      font-size: clamp(11px, 3vw, 14px);
      line-height: 1.6;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 8px 14px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 200ms, background 200ms;
    }

    button:hover:not(:disabled) {
      opacity: 1;
      background: #49372a0c;
    }

    button:focus-visible {
      outline: 2px solid #49372a;
      outline-offset: 3px;
    }

    button:disabled {
      opacity: 0.3;
      cursor: default;
    }

    button svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .status {
      min-height: 32px;
      max-width: 320px;
      margin: 4px auto 0;
      font-size: 11px;
      line-height: 1.6;
      opacity: 0.75;
    }

    ::selection { background: #73513b40; }

    @keyframes pulse {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.045); }
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .cookie, .cookie-spin { animation: none; }
      .cookie-face, button { transition: none; }
    }
  </style>
</head>

<body>
  <main aria-label="A cookie just for you">
    <div class="cookie" id="cookie" role="img" aria-label="Cookie">
      <div class="cookie-spin">
        <span
          class="cookie-face"
          id="cookie-face"
          data-bites="0"
          aria-hidden="true"
        >🍪</span>
      </div>
    </div>

    <output
      class="id"
      id="cookie-id"
      aria-label="Remaining cookie hash"
      aria-live="polite"
    ></output>

    <div class="rarity" id="rarity"></div>

    <p id="message">This cookie is only supposed to be for you.</p>

    <div class="actions">
      <button id="eat" type="button" disabled>Eat cookie</button>

      <button id="share" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15V3m-4 4 4-4 4 4"/>
          <path d="M5 13v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/>
        </svg>
        Share cookie
      </button>
    </div>

    <div class="status" id="status" role="status"></div>

    <noscript>
      <p>Enable JavaScript to receive your cookie.</p>
    </noscript>
  </main>

  <script>
    const output = document.getElementById("cookie-id");
    const rarityLabel = document.getElementById("rarity");
    const cookieElement = document.getElementById("cookie");
    const cookieFace = document.getElementById("cookie-face");
    const message = document.getElementById("message");
    const eatButton = document.getElementById("eat");
    const shareButton = document.getElementById("share");
    const status = document.getElementById("status");

    let cookie = null;
    let generation = 0;
    let sharing = false;

    function storageKey(id) {
      return "cookie-bites:" + id;
    }

    function readBites(id) {
      const value = localStorage.getItem(storageKey(id));
      return /^[0-3]$/.test(value ?? "") ? Number(value) : 0;
    }

    function saveBites(id, bites) {
      const saved = Math.max(readBites(id), bites);
      localStorage.setItem(storageKey(id), String(saved));
      return saved;
    }

    function getRarity(length) {
      if (length >= 7) return "mythic";
      if (length >= 6) return "legendary";
      if (length >= 5) return "epic";
      if (length >= 4) return "rare";
      if (length >= 3) return "uncommon";
      return "common";
    }

    function displayHash(hash) {
      const fragment = document.createDocumentFragment();

      for (const sequence of hash.match(/(.)\1*/g) || []) {
        if (sequence.length >= 2) {
          const highlight = document.createElement("mark");
          highlight.textContent = sequence;
          highlight.dataset.level = getRarity(sequence.length);
          highlight.title =
            `${sequence.length} identical characters in a row`;
          fragment.appendChild(highlight);
        } else {
          fragment.appendChild(document.createTextNode(sequence));
        }
      }

      output.replaceChildren(fragment);
    }

    function updateBrowserCookie() {
      if (!cookie) return;

      try {
        const secure = location.protocol === "https:" ? "; Secure" : "";

        if (cookie.bites === 3) {
          document.cookie =
            "your_cookie=; Path=/; Max-Age=0; SameSite=Lax" + secure;
        } else {
          const length = Math.floor(64 * (3 - cookie.bites) / 3);

          document.cookie =
            "your_cookie=" + cookie.id.slice(0, length) +
            "; Path=/; Max-Age=31536000; SameSite=Lax" + secure;
        }
      } catch {
        // Browser-cookie storage is optional.
      }
    }

    function renderCookie() {
      if (!cookie) return;

      const gone = cookie.bites === 3;
      const length = Math.floor(64 * (3 - cookie.bites) / 3);

      displayHash(cookie.id.slice(0, length));

      cookieFace.dataset.bites = String(cookie.bites);
      cookieElement.classList.toggle("eaten", gone);
      cookieElement.setAttribute(
        "aria-label",
        gone ? "Cookie eaten" : `Cookie, ${3 - cookie.bites} bites remaining`
      );

      // Rarity belongs to the original cookie.
      const longest = Math.max(
        ...(cookie.id.match(/(.)\1*/g) || []).map(run => run.length)
      );

      rarityLabel.textContent = gone ? "" : getRarity(longest);
      rarityLabel.dataset.level = gone ? "" : getRarity(longest);

      message.textContent = gone
        ? "This cookie is gone. You ate it."
        : "This cookie is only supposed to be for you.";

      eatButton.textContent = cookie.bites === 0
        ? "Eat cookie"
        : gone ? "Gone" : "Take another bite";

      eatButton.disabled = gone || sharing;
      shareButton.disabled = gone || sharing;

      updateBrowserCookie();
    }

    async function createCookie() {
      const request = ++generation;

      cookie = null;
      eatButton.disabled = true;
      shareButton.disabled = true;
      status.textContent = "";

      try {
        const params = new URL(location.href).searchParams;
        const sharedId = params.get("cookie");
        let id;

        if (sharedId && /^[a-f0-9]{64}$/i.test(sharedId)) {
          id = sharedId.toLowerCase();
        } else {
          const random = crypto.getRandomValues(new Uint8Array(32));
          const bytes = crypto.subtle
            ? new Uint8Array(await crypto.subtle.digest("SHA-256", random))
            : random;

          id = Array.from(bytes, byte =>
            byte.toString(16).padStart(2, "0")
          ).join("");
        }

        if (request !== generation) return;

        const incomingBites = sharedId &&
          /^[0-3]$/.test(params.get("bites") ?? "")
            ? Number(params.get("bites"))
            : 0;

        // Persist the state before allowing the cookie to be eaten.
        const bites = saveBites(id, incomingBites);

        cookie = { id, bites };
        renderCookie();

        if (bites === 3) {
          status.textContent = "Only crumbs remain.";
        }
      } catch {
        if (request !== generation) return;

        output.textContent = "";
        rarityLabel.textContent = "";
        status.textContent =
          "Allow local storage and reload to keep your cookie's bite history.";
      }
    }

    eatButton.addEventListener("click", () => {
      if (!cookie || cookie.bites >= 3 || sharing) return;

      try {
        // Check saved state in case another tab already took a bite.
        const latest = Math.max(cookie.bites, readBites(cookie.id));
        const next = Math.min(3, latest + 1);

        // Save first: a failed write must not silently lose bite history.
        cookie.bites = saveBites(cookie.id, next);
        renderCookie();

        const remaining = 3 - cookie.bites;
        status.textContent = remaining === 0
          ? "Only crumbs remain."
          : `${remaining} ${remaining === 1 ? "bite" : "bites"} left.`;
      } catch {
        status.textContent =
          "Your browser could not save this bite. Please allow local storage.";
      }
    });

    async function copyLink(url) {
      try {
        await navigator.clipboard.writeText(url);
        status.textContent = "Link copied.";
      } catch {
        window.prompt("Copy your cookie link:", url);
      }
    }

    shareButton.addEventListener("click", async () => {
      if (!cookie || cookie.bites >= 3 || sharing) return;

      if (!["https:", "http:"].includes(location.protocol)) {
        status.textContent = "Open the hosted page to share a link.";
        return;
      }

      try {
        cookie.bites = Math.max(cookie.bites, readBites(cookie.id));
        renderCookie();
      } catch {
        status.textContent = "Could not check this cookie's bite history.";
        return;
      }

      if (cookie.bites >= 3) {
        status.textContent = "This cookie has already been eaten.";
        return;
      }

      const url = new URL(location.href);
      url.search = "";
      url.hash = "";
      url.searchParams.set("cookie", cookie.id);

      // Share the cookie with its current number of bites.
      if (cookie.bites > 0) {
        url.searchParams.set("bites", String(cookie.bites));
      }

      sharing = true;
      renderCookie();
      status.textContent = "";

      try {
        if (navigator.share) {
          try {
            await navigator.share({
              title: "A cookie for you 🍪",
              text: "This cookie is only supposed to be for you.",
              url: url.href
            });
          } catch (error) {
            if (error.name !== "AbortError") {
              await copyLink(url.href);
            }
          }
        } else {
          await copyLink(url.href);
        }
      } finally {
        sharing = false;
        renderCookie();
      }
    });

    // Keep open tabs in sync when the same cookie is eaten elsewhere.
    window.addEventListener("storage", event => {
      if (!cookie || event.key !== storageKey(cookie.id)) return;

      try {
        cookie.bites = Math.max(cookie.bites, readBites(cookie.id));
        renderCookie();

        if (cookie.bites === 3) {
          status.textContent = "Only crumbs remain.";
        }
      } catch {
        // Preserve the current state if storage becomes unavailable.
      }
    });

    window.addEventListener("pageshow", createCookie);
  </script>
</body>
</html>
