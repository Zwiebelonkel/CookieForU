services:
  - type: web
    name: a-cookie-for-you
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
# RENDER_EXTERNAL_URL supplies the public origin automatically.
# Add PUBLIC_BASE_URL manually if you switch to a custom domain.
